name: "Send Newsletter on New Post"

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new post and send newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: "https://osomdosilencio.com.br"
        run: |
          # Execute pre-committed Python script to avoid any heredoc/indentation issues
          python3 .github/scripts/send_newsletter.py
