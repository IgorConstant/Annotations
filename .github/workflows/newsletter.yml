name: "Send Newsletter on New Post"

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new post and send newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: "https://osomdosilencio.com.br"
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys, re, json, os

          result = subprocess.run(
              ["git", "diff", "--name-status", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          new_posts = [
              line.split("\t")[1]
              for line in result.stdout.splitlines()
              if line.startswith("A\t") and line.endswith(".md") and "_posts/" in line
          ]

          if not new_posts:
              print("Nenhum post novo detectado. Pulando envio.")
              sys.exit(0)

          api_key = os.environ.get("BUTTONDOWN_API_KEY", "")
          if not api_key:
              print("BUTTONDOWN_API_KEY não configurada.")
              sys.exit(1)

          for post_file in new_posts:
              print(f"Novo post encontrado: {post_file}")

              with open(post_file, "r", encoding="utf-8") as f:
                  content = f.read()

              fm_match = re.match(r"^---\n(.*?)\n---\n?(.*)", content, re.DOTALL)
              if not fm_match:
                  print(f"Front matter não encontrado em {post_file}. Pulando.")
                  continue

              fm_raw = fm_match.group(1)
              body_md = fm_match.group(2).strip()

              def get_field(field):
                  m = re.search(rf'^{field}:\s*["\']?(.*?)["\']?\s*$', fm_raw, re.MULTILINE)
                  return m.group(1).strip() if m else ""

              title = get_field("title")
              description = get_field("description")
              slug = re.sub(r"^\d{4}-\d{2}-\d{2}-", "", os.path.basename(post_file).replace(".md", ""))
              post_url = f"{os.environ['SITE_URL']}/{slug}/"

              email_body = (
                  f"<h2>{title}</h2>"
                  f"<p><em>{description}</em></p>"
                  "<hr>"
                  + body_md[:800].replace("\n", "<br>") +
                  f"<br><br><p><a href=\"{post_url}\">→ Leia o texto completo no blog</a></p>"
                  "<hr>"
                  "<p style=\"font-size:0.85em;color:#888;\">Você está recebendo este e-mail porque se inscreveu em o som do silêncio.<br>"
                  "<a href=\"{{ unsubscribe_url }}\">Cancelar inscrição</a></p>"
              )

              payload = json.dumps({
                  "subject": title,
                  "body": email_body,
                  "status": "about_to_send"
              })

              # Write payload to temp file to avoid shell escaping issues
              with open("/tmp/bd_payload.json", "w") as f:
                  f.write(payload)

              print(f"Enviando newsletter: {title}")
          PYEOF

          # Use curl directly so X-Buttondown-Live-Dangerously is sent reliably
          TITLE=$(python3 -c "
          import re, sys
          content = open(sys.argv[1]).read()
          fm = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          if fm:
              m = re.search(r'^title:\s*[\"\'"]?(.*?)[\"\'"]?\s*$', fm.group(1), re.MULTILINE)
              print(m.group(1).strip() if m else '')
          " "$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' | head -1)" 2>/dev/null || echo "")

          if [ ! -f /tmp/bd_payload.json ]; then
            echo "Nenhum post novo. Pulando."
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /tmp/bd_response.json -w "%{http_code}" \
            -X POST "https://api.buttondown.email/v1/emails" \
            -H "Authorization: Token ${BUTTONDOWN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "X-Buttondown-Live-Dangerously: true" \
            -d @/tmp/bd_payload.json)

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/bd_response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Newsletter enviada com sucesso!"
          else
            echo "❌ Erro ao enviar newsletter (status $HTTP_STATUS)"
            exit 1
          fi
